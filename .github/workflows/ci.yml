name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: ./build.sh test
      - name: Sample outputs are up to date
        run: |
          J="java -cp out/main dev.jvch.radar.Main"
          $J report samples/scan-2026-02-22.xml --format md > /tmp/r.md || test $? -eq 1
          diff /tmp/r.md docs/sample-report.md
          $J diff samples/scan-2026-02-01.xml samples/scan-2026-02-22.xml > /tmp/d.md || test $? -eq 1
          diff /tmp/d.md docs/sample-diff.md
